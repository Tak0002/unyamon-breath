<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#19243a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="うにゃ呼吸" />
    <meta
      name="description"
      content="うにゃもんと一緒に、浅い呼吸や眠れない夜をゆっくり整えるPWA。"
    />
    <title>うにゃもん呼吸室</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <img class="room-backdrop" src="./assets/unyamon-room.jpg" alt="" />
      <div class="room-tint"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">breathing room</p>
          <h1>うにゃもん呼吸室</h1>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="設定">
          <span aria-hidden="true">⋯</span>
        </button>
      </header>

      <main>
        <section class="hero" aria-live="polite">
          <div class="breath-orbit" id="breathOrbit">
            <img class="unyamon-icon" src="./assets/icons/icon-512.png" alt="うにゃもん" />
          </div>
          <div class="phase-readout">
            <p id="phaseLabel">いまはどんな感じ？</p>
            <strong id="phaseSeconds">選んでね</strong>
          </div>
        </section>

        <section class="routine-panel" id="routinePanel" aria-label="呼吸法">
          <div class="routine-grid" id="routineGrid"></div>
        </section>

        <section class="session-panel" id="sessionPanel" hidden>
          <div class="session-meter">
            <div>
              <p>今日</p>
              <strong id="todayMinutes">0分</strong>
            </div>
            <div>
              <p>今回</p>
              <strong id="sessionElapsed">0:00</strong>
            </div>
            <div>
              <p>めぐり</p>
              <strong id="cycleCount">0</strong>
            </div>
          </div>
          <div class="session-actions">
            <button class="secondary-button" id="backButton" type="button">変える</button>
            <button class="primary-button" id="toggleButton" type="button">はじめる</button>
            <button class="secondary-button" id="finishButton" type="button">おしまい</button>
          </div>
        </section>

        <section class="history-panel" aria-label="最近の記録">
          <div class="section-heading">
            <h2>最近</h2>
            <button class="text-button" id="clearHistoryButton" type="button">消す</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </main>

      <p class="safety-note">苦しい、めまいがする、つらさが強いときは中止して休んでね。</p>
    </div>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog">
        <div class="dialog-header">
          <h2>設定</h2>
          <button class="icon-button" value="close" aria-label="閉じる">×</button>
        </div>
        <label class="toggle-row">
          <span>音</span>
          <input id="soundToggle" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>振動</span>
          <input id="vibrationToggle" type="checkbox" checked />
        </label>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
